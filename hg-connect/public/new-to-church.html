<!doctype html>
<html lang="en-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I’m New To Church! · HG Link</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/serve.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" class="form-page">
    <a class="back-link" href="/">← HG Link</a>
    <h1>I’m New To Church!</h1>
    <p class="preview-note" id="preview-note">Local preview. Use fictional details. Your answers stay on this page.</p>
    <form data-preview-form method="dialog" aria-describedby="preview-note">
      <div class="field-pair">
        <label>First name<input name="firstName" autocomplete="given-name" required maxlength="100"></label>
        <label>Last name<input name="lastName" autocomplete="family-name" required maxlength="100"></label>
      </div>
      <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Phone number<input name="phone" type="tel" autocomplete="tel" required maxlength="40"></label>
      <label>Invited by <span class="optional">(optional)</span><input name="invitedBy" maxlength="100"></label>
      <fieldset>
        <legend>Please confirm both to continue</legend>
        <label class="choice"><input type="checkbox" name="lookingForChurch" value="yes" required> Looking for church?</label>
        <label class="choice"><input type="checkbox" name="interestedInJesus" value="yes" required> Interested to know more about Jesus?</label>
      </fieldset>
      <button type="submit" disabled>Check form</button>
      <p class="form-result" role="status"></p>
    </form>
  </main>
</body>
</html>
