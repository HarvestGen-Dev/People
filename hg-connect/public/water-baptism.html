<!doctype html>
<html lang="en-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Want To Be Water Baptised · HG Link</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/serve.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" class="form-page">
    <a class="back-link" href="/">← HG Link</a>
    <h1>I Want To Be Water Baptised</h1>
    <p class="preview-note" id="preview-note">Local preview. Use fictional details. Your answers stay on this page.</p>
    <form data-preview-form method="dialog" aria-describedby="preview-note">
      <div class="field-pair">
        <label>First name<input name="firstName" autocomplete="given-name" required maxlength="100"></label>
        <label>Last name<input name="lastName" autocomplete="family-name" required maxlength="100"></label>
      </div>
      <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <div class="field-pair">
        <label>Gender<select name="gender" required><option value="">Select gender</option><option value="male">Male</option><option value="female">Female</option></select></label>
        <label>Birthdate<input name="birthdate" type="date" autocomplete="bday" required></label>
      </div>
      <label>Marital status<select name="maritalStatus" required><option value="">Select marital status</option><option value="single">Single</option><option value="married">Married</option><option value="widowed">Widowed</option><option value="separated">Separated</option></select></label>
      <label>Connect Group<select name="connectGroup" required><option value="">Select connect group</option><option value="HG1">HG1</option><option value="HG2">HG2</option><option value="HG3">HG3</option><option value="HG4">HG4</option><option value="HG5">HG5</option><option value="HG6">HG6</option><option value="HG7">HG7</option><option value="HG8">HG8</option><option value="HG9">HG9</option><option value="HG10">HG10</option><option value="HG Teens">HG Teens</option><option value="Kids Gen">Kids Gen</option></select></label>
      <button type="submit" disabled>Check form</button>
      <p class="form-result" role="status"></p>
    </form>
  </main>
</body>
